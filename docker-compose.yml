services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studviro
      POSTGRES_PASSWORD: studviro
      POSTGRES_DB: studviro
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studviro -d studviro']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for development and CI. Production points the
  # same client at Cloudflare R2 or AWS S3 by changing four environment
  # variables; nothing in the code knows the difference.
  #
  # Pulled from quay.io, which is MinIO's own registry: the Docker Hub mirror
  # is gated and `docker pull minio/minio` fails with an access denial that
  # reads like a typo.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: studviro
      MINIO_ROOT_PASSWORD: studviro
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once and exits. Without it the first upload fails
  # against a store that is running but empty, which reads as a code bug.
  minio-bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 studviro studviro
        mc mb --ignore-existing local/studviro
        mc anonymous set none local/studviro

  app:
    profiles: ['app']
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://studviro:studviro@postgres:5432/studviro
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: http://localhost:3000
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: studviro
      STORAGE_ACCESS_KEY_ID: studviro
      STORAGE_SECRET_ACCESS_KEY: studviro
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
