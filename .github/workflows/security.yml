name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after merge still surfaces.
    - cron: '17 4 * * 1'

# The repository is private without GitHub Advanced Security, so code scanning
# uploads are rejected. Each scanner therefore fails its own job instead of
# publishing SARIF to the Security tab.
permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        # Only prod deps: a dev-only advisory should not block a hotfix.
        run: pnpm audit --prod --audit-level high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 14

      - name: Fail on security findings
        # Only error-severity rules: the security-and-quality suite also emits
        # style warnings that should not block a merge.
        run: |
          count=$(jq '[.runs[].results[]? | select(.level == "error")] | length' \
            codeql-results/javascript.sarif)
          echo "CodeQL error-severity findings: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]? | select(.level == "error")
              | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' \
              codeql-results/javascript.sarif
            exit 1
          fi

  image:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t studviro-backend:scan .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: studviro-backend:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # No SARIF upload available, so a finding must fail the job directly.
          exit-code: '1'
